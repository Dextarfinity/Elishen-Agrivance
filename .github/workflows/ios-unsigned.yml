# Builds an iOS .ipa on GitHub's macOS runners (no Mac needed locally).
# If signing secrets are configured in GitHub Actions, this produces a signed
# release IPA suitable for TestFlight/App Store style distribution. Otherwise it
# falls back to an unsigned IPA that can still be packaged and inspected.
#
# Runs on demand (Actions tab -> iOS unsigned IPA -> Run workflow) and
# automatically whenever this file itself changes.
name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ios-unsigned.yml

jobs:
  build:
    runs-on: macos-14
    env:
      APP_PATH: capacitor/ios/App
      KEYCHAIN_PASSWORD: temporary-keychain-password
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor deps
        working-directory: capacitor
        run: npm ci

      - name: Sync web assets into the iOS project
        working-directory: capacitor
        run: npx cap sync ios

      - name: Install signing assets
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 --decode > ios_certificate.p12
          security import ios_certificate.p12 -k build.keychain -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
        working-directory: ${{ env.APP_PATH }}

      - name: Build app (signed release archive)
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}
        working-directory: ${{ env.APP_PATH }}
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -archivePath build/App.xcarchive archive \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic

      - name: Export signed IPA
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}
        working-directory: ${{ env.APP_PATH }}
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${{ env.IOS_EXPORT_METHOD || 'ad-hoc' }}</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Build app (unsigned)
        if: ${{ !(secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '') }}
        working-directory: ${{ env.APP_PATH }}
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package into .ipa
        if: ${{ !(secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '') }}
        working-directory: capacitor/ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ElishenAgrivance-unsigned.ipa Payload

      - name: Publish signed IPA artifact
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ElishenAgrivance-signed-ipa
          path: capacitor/ios/App/build/export/*.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ !(secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '') }}
        with:
          name: ElishenAgrivance-unsigned-ipa
          path: capacitor/ios/App/ElishenAgrivance-unsigned.ipa
          retention-days: 30
